      "feature.desc": "Got an idea or a feature you'd love to see? Send us an email — we read every suggestion.",

  };

  function setLang(lang) {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang][key] !== undefined) el.textContent = i18n[lang][key];
    });
    document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    localStorage.setItem('tera-lang', lang);
  }

  const saved = localStorage.getItem('tera-lang');
  const preferred = saved || (navigator.language.startsWith('zh') ? 'zh' : 'en');
  setLang(preferred);

  // HLS hero video: Safari native, hls.js elsewhere. Force play() after load.
  (function () {
    const v = document.getElementById('hero-video');
    if (!v) return;
    const src = v.dataset.hls;
    const tryPlay = () => {
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    };
    if (src && v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = src;
      v.addEventListener('loadedmetadata', tryPlay, { once: true });
    } else if (src) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
      s.onload = function () {
        if (window.Hls && window.Hls.isSupported()) {
          const hls = new window.Hls({ lowLatencyMode: false });
          hls.loadSource(src);
          hls.attachMedia(v);
          hls.on(window.Hls.Events.MANIFEST_PARSED, tryPlay);
        } else {
          tryPlay();
        }
      };
      s.onerror = tryPlay;
      document.head.appendChild(s);
    } else {
      tryPlay();
    }
    v.addEventListener('canplay', tryPlay, { once: true });
  })();

  // A precise digital point surface behind the product demo. The ordered grid
  // reads as a coherent wave instead of scattered background noise.
  (function () {
    const canvas = document.getElementById('hero-particles');
    if (!canvas) return;

    const ctx = canvas.getContext('2d', { alpha: true });
    if (!ctx) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let width = 0;
    let height = 0;
    let dpr = 1;
    let points = [];
    let frame = 0;
    let visible = true;

    function rebuild() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const compact = width < 640;
      const columns = compact ? 38 : 62;
      const rows = compact ? 25 : 34;
      const startX = compact ? width * 0.08 : width * 0.34;
      const startY = compact ? height * 0.47 : height * 0.08;
      const fieldWidth = compact ? width * 0.98 : width * 0.72;
      const fieldHeight = compact ? height * 0.48 : height * 0.82;
      points = [];
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const u = column / (columns - 1);
          const v = row / (rows - 1);
          points.push({
            u,
            v,
            x: startX + u * fieldWidth,
            y: startY + v * fieldHeight
          });
        }
      }
    }

    function draw(time) {
      ctx.clearRect(0, 0, width, height);
      const t = reduceMotion.matches ? 0 : time * 0.001;

      // A restrained blue nebula: two soft elliptical clouds sit behind the
      // ordered point surface without turning the page into a star field.
      const compact = width < 640;
      const nebulaX = width * (compact ? 0.56 : 0.76);
      const nebulaY = height * (compact ? 0.72 : 0.47);
      const nebulaRadius = width * (compact ? 0.72 : 0.43);
      const breathe = 1 + Math.sin(t * 0.18) * 0.025;

      ctx.save();
      ctx.translate(nebulaX, nebulaY);
      ctx.rotate(-0.18 + Math.sin(t * 0.11) * 0.018);
      ctx.scale(breathe, 0.43);
      const nebula = ctx.createRadialGradient(0, 0, 0, 0, 0, nebulaRadius);
      nebula.addColorStop(0, 'rgba(76, 122, 224, 0.16)');
      nebula.addColorStop(0.34, 'rgba(46, 84, 178, 0.10)');
      nebula.addColorStop(0.68, 'rgba(24, 47, 105, 0.055)');
      nebula.addColorStop(1, 'rgba(5, 6, 8, 0)');
      ctx.fillStyle = nebula;
      ctx.beginPath();
      ctx.arc(0, 0, nebulaRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(nebulaX + nebulaRadius * 0.16, nebulaY - nebulaRadius * 0.09);
      ctx.scale(1, 0.32);
      const coreGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, nebulaRadius * 0.52);
      coreGlow.addColorStop(0, 'rgba(151, 196, 255, 0.095)');
      coreGlow.addColorStop(0.46, 'rgba(84, 139, 232, 0.052)');
      coreGlow.addColorStop(1, 'rgba(5, 6, 8, 0)');
      ctx.fillStyle = coreGlow;
      ctx.beginPath();
      ctx.arc(0, 0, nebulaRadius * 0.52, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (const point of points) {
        const envelope = Math.sin(point.v * Math.PI);
        const wave =
          Math.sin(point.u * Math.PI * 4.2 - t * 0.7 + point.v * 2.4) * 28 * envelope +
          Math.sin(point.u * Math.PI * 1.8 + t * 0.34 - point.v * 4.6) * 12;
        const depth = 0.5 + 0.5 * Math.sin(
          point.u * Math.PI * 3.1 - point.v * Math.PI * 2.3 - t * 0.44
        );
        const edgeFade = Math.sin(point.u * Math.PI) * Math.sin(point.v * Math.PI);
        const textClear = width < 640 ? 1 : Math.min(1, Math.max(0, (point.u + 0.08) * 2.4));
        const signalPosition = (t * 0.055) % 1.35;
        const signalDistance = Math.abs(point.u + point.v * 0.22 - signalPosition);
        const signal = Math.exp(-signalDistance * signalDistance * 125);
        const opacity = (0.10 + depth * 0.30 + signal * 0.34) * edgeFade * textClear;
        if (opacity < 0.018) continue;

        const x = point.x + wave * 0.18 + depth * 8;
        const y = point.y + wave;
        const size = 0.62 + depth * 0.72 + signal * 0.55;
        const red = Math.round(118 + depth * 62 + signal * 38);
        const green = Math.round(154 + depth * 48 + signal * 42);
        const blue = 232 + Math.round(signal * 23);

        ctx.beginPath();
        ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${opacity})`;
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tick(time) {
      draw(time);
      frame = visible && !reduceMotion.matches ? requestAnimationFrame(tick) : 0;
    }

    function restart() {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      if (visible && !document.hidden && !reduceMotion.matches) {
        frame = requestAnimationFrame(tick);
      } else {
        draw(0);
      }
    }

    const observer = new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      restart();
    }, { threshold: 0.02 });

    const resizeObserver = new ResizeObserver(() => {
      rebuild();
      restart();
    });

    observer.observe(canvas);
    resizeObserver.observe(canvas);
    reduceMotion.addEventListener?.('change', restart);
    document.addEventListener('visibilitychange', restart);
    rebuild();
    restart();
  })();
</script>
